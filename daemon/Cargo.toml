[package]
name = "omarchycastd"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "Search daemon for the Omarchycast launcher overlay"
license = "MIT"
repository = "https://github.com/Aditya-Raj-Tiwari/omarchycast"

[dependencies]
anyhow = "1.0.104"
dirs = "6.0.0"
fend-core = "1.5.8"
freedesktop-desktop-entry = "0.8.2"
freedesktop-icons = "0.4.0"
libc = "0.2.189"
notify-debouncer-full = "0.6.0"
nucleo-matcher = "0.3.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
